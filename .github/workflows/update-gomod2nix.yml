name: gomod2nix Check

on:
  push:
    branches: [main]
    paths: [go.mod, go.sum, gomod2nix.toml, flake.nix, flake.lock]
  pull_request:
    branches: [main]
    paths: [go.mod, go.sum, gomod2nix.toml, flake.nix, flake.lock]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Verify gomod2nix.toml
        run: |
          nix develop --extra-experimental-features "nix-command flakes" '.#' -c gomod2nix
          git diff --exit-code -- gomod2nix.toml
