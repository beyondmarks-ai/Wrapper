name: Windows Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download official Everything SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://www.voidtools.com/Everything-SDK.zip -OutFile "$env:RUNNER_TEMP\Everything-SDK.zip"
          $actualHash = (Get-FileHash "$env:RUNNER_TEMP\Everything-SDK.zip" -Algorithm SHA256).Hash
          if ($actualHash -ne 'F5716D9513CCE6B462B5170A0A2E7E081E191D9BCAC6774F5DECC061497DF443') {
            throw "Everything SDK checksum mismatch: $actualHash"
          }
          Expand-Archive "$env:RUNNER_TEMP\Everything-SDK.zip" "$env:RUNNER_TEMP\Everything-SDK"
          $dll = Get-ChildItem "$env:RUNNER_TEMP\Everything-SDK" -Filter Everything64.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'Everything64.dll was not found in the SDK archive.' }
          "EVERYTHING_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup --exact --accept-source-agreements --accept-package-agreements --silent
      - name: Build installer
        shell: pwsh
        env:
          WRAPPER_CLOUD_API_URL: ${{ vars.WRAPPER_CLOUD_API_URL }}
          WRAPPER_GOOGLE_CLIENT_ID: ${{ vars.WRAPPER_GOOGLE_CLIENT_ID }}
          WRAPPER_FIREBASE_API_KEY: ${{ vars.WRAPPER_FIREBASE_API_KEY }}
        run: .\scripts\package.ps1 -EverythingDll "$env:EVERYTHING_DLL"
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Resolve-Path 'dist\Wrapper-Setup-x64.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          "$hash  Wrapper-Setup-x64.exe" | Out-File 'dist\SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wrapper-Windows-x64
          path: |
            dist/Wrapper-Setup-x64.exe
            dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Wrapper-Setup-x64.exe
            dist/SHA256SUMS.txt
