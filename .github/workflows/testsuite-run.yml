name: Python Testsuite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux libimage-exiftool-perl zoxide
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Wrapper
        run: ./build.sh
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: testsuite/requirements.txt
      - name: Install Python dependencies
        run: pip install -r testsuite/requirements.txt
      - name: Run integration tests
        run: python testsuite/main.py -d
      - name: Print Wrapper logs
        if: always()
        run: test ! -f ~/.local/state/wrapper/wrapper.log || cat ~/.local/state/wrapper/wrapper.log
