name: Deploy Wrapper Cloud

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/pkg/remote/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: wrapper-cloud-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}'
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build and push immutable image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wrapper/backend:${{ github.sha }}
        run: |
          docker build --file backend/Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy Cloud Run revision
        run: |
          gcloud run deploy wrapper-cloud \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE" \
            --service-account "wrapper-cloud@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --quiet
      - name: Verify health
        run: |
          URL="$(gcloud run services describe wrapper-cloud --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')"
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 "$URL/health"
